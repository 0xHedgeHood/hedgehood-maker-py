[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hedgehood-maker"
version = "0.1.0"
description = "Market-maker SDK for the Hedgehood options RFQ gateway: EIP-712 quotes, a WebSocket maker client and unsigned settler transactions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hedgehood" }]
requires-python = ">=3.10"
dependencies = [
    "eth-account>=0.13",
    "websockets>=13",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/0xHedgeHood/hedgehood-maker-py"
"Maker guide" = "https://github.com/0xHedgeHood/sdks/blob/main/docs/MAKER_GUIDE.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hedgehood_maker = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
